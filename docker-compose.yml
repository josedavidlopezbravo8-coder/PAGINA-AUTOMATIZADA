version: "3.9"


networks:
  ebook-network:
    driver: bridge

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ebook-network
    restart: on-failure

  data-quality-module:
    build:
      context: ./data-quality-module
      dockerfile: Dockerfile
    ports:
      - "8007:8007"
    environment:
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
    networks:
      - ebook-network
    restart: on-failure

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
    depends_on:
      - postgres
    networks:
      - ebook-network
    restart: on-failure

  bff-gateway:
    build:
      context: ./bff-gateway
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
    environment:
      DATA_QUALITY_URL: ${DATA_QUALITY_URL}
      
      AUTH_SERVICE_URL:      ${AUTH_SERVICE_URL}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
      CATALOG_SERVICE_URL:   ${CATALOG_SERVICE_URL}
      AI_ENRICHMENT_URL:     ${AI_ENRICHMENT_URL}
      CONFIG_MODULE_URL:     ${CONFIG_MODULE_URL}
    depends_on:
      - data-quality-module
      - config-module
    networks:
      - ebook-network
    restart: on-failure

  config-module:
    build:
      context: ./config-module
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    networks:
      - ebook-network
    restart: on-failure

  config-module:
    build:
      context: ./config-module
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    networks:
      - ebook-network
    restart: on-failure

volumes:
  postgres_data:
